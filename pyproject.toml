[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-workflows"
version = "0.1.0"
description = "Codex-first Blender MCP previs and AI video handoff workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aivw = "aivw.cli:main"

[tool.setuptools]
packages = ["aivw", "blender_scripts"]
