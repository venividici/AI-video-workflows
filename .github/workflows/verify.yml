name: Verify workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Unit, protocol, import and media tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI registration
        run: python -m aivw --help

  blender:
    name: Real Blender 4.5.3 LTS
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install media and graphics runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libxi6 libxrender1 libxxf86vm1
      - name: Download verified Blender archive
        shell: bash
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz --output "$RUNNER_TEMP/blender.tar.xz"
          echo "975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render, recover and snapshot real Blender projects
        env:
          AIVW_RUN_BLENDER_TESTS: '1'
          BLENDER_BIN: ${{ runner.temp }}/blender-4.5.3-linux-x64/blender
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python -m unittest discover -s tests -p test_blender.py -v
